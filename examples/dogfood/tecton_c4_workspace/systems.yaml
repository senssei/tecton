    description: Primary command-line interface entry point coordinating APM, linting, and exports
    business_criticality: MISSION_CRITICAL
    functional_suitability: 4.9
    technical_suitability: 4.8
    time_classification: INVEST
    current_phase: active
    capabilities:
      - cap-cli
      - cap-living-docs
    user_groups:
      - Enterprise Architects
      - Platform Engineers
      - CI/CD Automations
    technologies:
