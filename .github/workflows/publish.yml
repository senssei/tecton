name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version tag, e.g. v0.1.0
        required: true
        type: string
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.target }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,release]'
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py "$RELEASE_TAG"
      - run: python -m pytest
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/check_distribution.py
      - name: Exercise installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/tecton-wheel"
          "$RUNNER_TEMP/tecton-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/tecton-wheel/bin/python" scripts/smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
