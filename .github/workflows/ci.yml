name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python scripts/check_docs.py
  package:
    name: Distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[release]'
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/check_distribution.py
      - name: Install and exercise wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/tecton-wheel"
          "$RUNNER_TEMP/tecton-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/tecton-wheel/bin/python" scripts/smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
