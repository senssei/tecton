name: EAM pilot

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: EAM pilot catalog
    runs-on: ubuntu-latest
    steps:
      # pull_request checks the synthetic merge commit, not just the PR head.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate merged catalog
        run: tecton validate examples/dogfood/tecton_c4_workspace --require-owner --format json
      - name: Verify pilot scenarios
        run: python -m pytest tests/integration/test_eam_pilot.py tests/integration/test_dogfood.py tests/unit/test_architecture.py
      - name: Build read-only portal
        run: tecton export portal --source examples/dogfood/tecton_c4_workspace -o dist/eam-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: eam-pilot-portal
          path: dist/eam-pilot/
