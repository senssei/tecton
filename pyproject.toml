[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tecton"
version = "0.1.0"
description = "Deterministic Enterprise Architecture Intelligence Engine & Architecture-as-Code Toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tecton Architecture Team" }
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0"
]

[project.scripts]
tecton = "tecton.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
